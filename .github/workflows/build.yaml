name: Build and Deploy
on:
  push:
    #branches: [main]

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          role-session-name: gha-session

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short sha
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: tracking-events
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Update cubeconfig
        run: |
          aws eks update-kubeconfig --name routebox-dev

      - name: Deploy to k8s/EKS with Helm
        run: |
          cat > /tmp/secret-values.yaml << EOF
          secrets:
            DATABASE_URL: "${{ secrets.DATABASE_URL }}"
            AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
            AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            CARRIER_SIGNATURE_SECRETS: "${{ secrets.CARRIER_SIGNATURE_SECRETS }}"
          EOF

          helm upgrade --install routebox-tracking-events ./helm \
            --namespace tracking-events \
            --create-namespace \
            --values helm/dev-values.yaml \
            --values /tmp/secret-values.yaml \
            --set image.tag=$IMAGE_TAG \
            --wait
