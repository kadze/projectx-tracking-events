apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fullname }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.AWS_ACCESS_KEY_ID | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.AWS_SECRET_ACCESS_KEY | quote }}
  CARRIER_SIGNATURE_SECRETS: {{ .Values.secrets.CARRIER_SIGNATURE_SECRETS | quote }}
